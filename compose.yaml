name: kanboard
services:
  kanboard:
    image: kanboard/kanboard:latest
    container_name: kanboard
    restart: always
    ports:
      - "5001:80"
      - "4433:443"
    volumes:
      - kanboard_data:/var/www/app/data
      - kanboard_plugins:/var/www/app/plugins
      - kanboard_ssl:/etc/nginx/ssl
    environment:
      - PLUGIN_INSTALLER=true # Enables web-based plugin installation
volumes:
  kanboard_data:
  kanboard_plugins:
  kanboard_ssl: